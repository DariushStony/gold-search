<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fffdf9" />
    <meta
      name="description"
      content="زرسنج: طلای مورد نظرتان را با یک جمله‌ی فارسی بنویسید و ببینید چقدر از قیمت، طلاست."
    />
    <title>زرسنج، جست‌وجوی طلا با یک جمله</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap"
    />
    <script src="/assets/theme-init.js"></script>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <!-- @header:search -->
    <div class="banner" id="archive" data-region hidden></div>
    <section class="intro" data-region>
      <div class="wrap">
        <p class="dateline num" aria-live="polite">
          <span class="dateline-label" id="g-label">طلای ۱۸ عیار، هر گرم</span>
          <b class="dateline-price" id="g-price"></b>
          <span class="dateline-meta" id="rate">در حال گرفتن قیمت طلا</span>
        </p>
        <h1 class="intro-title">طلای مورد نظرتان را با یک جمله بنویسید</h1>
        <div class="search" role="search">
          <label class="sr-only" for="q">جست‌وجوی طلا</label>
          <input
            class="query"
            id="q"
            maxlength="300"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="مثلاً: یه دستبند ظریف برای روز مادر تا ۲۰ تومن"
          />
          <button class="search-btn" id="go-search" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <span>جست‌وجو</span>
          </button>
        </div>
        <div class="samples" id="samples" aria-label="نمونه‌ی جمله"></div>
        <div class="unread" id="unread" hidden></div>
        <div class="ask" id="ask" hidden></div>
        <div class="suggest" id="suggest" hidden></div>
      </div>
    </section>

    <div class="toolbar" id="toolbar" data-region hidden>
      <div class="wrap toolbar-in">
        <button
          class="tool"
          id="open-filters"
          type="button"
          aria-haspopup="dialog"
          aria-controls="filters"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 6h16M7 12h10M10 18h4" />
          </svg>
          فیلترها<span class="tool-count num" id="filter-count" hidden></span>
        </button>
        <button
          class="tool sort-open"
          id="open-sort"
          type="button"
          aria-haspopup="dialog"
          aria-controls="sort-sheet"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4" />
          </svg>
          <span id="sort-label">پیشنهاد زرسنج</span>
        </button>
        <div class="chips" id="chips" aria-label="چیپ‌های جست‌وجو"></div>
      </div>
    </div>

    <main class="wrap layout" id="content">
      <aside
        class="filters"
        id="filters"
        aria-labelledby="filters-title"
        data-region
      ></aside>
      <section class="results-col" aria-labelledby="results-title" data-region>
        <div class="results-head">
          <h2 class="sr-only" id="results-title">نتیجه‌ها</h2>
          <p class="count num" id="count" role="status"></p>
          <button class="link" id="showEx" type="button" hidden></button>
          <div
            class="sort-inline"
            id="sort-inline"
            role="group"
            aria-label="مرتب‌سازی"
          ></div>
        </div>
        <div class="grid" id="results"></div>
        <div id="savings"></div>
        <div id="sections"></div>
        <div id="excluded" hidden></div>
        <p class="legend">
          چیپ پررنگ فیلتر است و کالا را کنار می‌گذارد. چیپ خط‌چین فقط ترتیب را عوض می‌کند.
        </p>
      </section>
    </main>
    <!-- @footer -->

    <div class="scrim" id="scrim" hidden></div>
    <div
      class="sheet"
      id="sort-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sort-title"
      hidden
    >
      <div class="sheet-head">
        <h2 id="sort-title">مرتب‌سازی بر اساس</h2>
        <button class="close" type="button" data-close aria-label="بستن">×</button>
      </div>
      <div
        class="sort-list"
        id="sort-list"
        role="group"
        aria-labelledby="sort-title"
      ></div>
    </div>
    <div
      class="sheet detail"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sh-t"
      hidden
    ></div>
  </body>
</html>
